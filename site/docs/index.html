<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Folks Dating System 完整 Markdown 系統文件閱讀器。左側選擇章節，右側閱讀 docs/system 原始內容。">
    <title>系統文件｜Folks Dating System</title>
    <link rel="stylesheet" href="./assets/system.css?v=docs-24">
  </head>
  <body>
    <a class="skip-link" href="#document-content">跳至文件內容</a>

    <div class="reader-app">
      <header class="reader-topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false">
            <span class="menu-icon" aria-hidden="true">☰</span>
            <span>目錄</span>
          </button>
          <a class="brand" href="../" aria-label="返回阿月 Dating App 首頁">
            <span class="brand-mark" aria-hidden="true">月</span>
            <span>阿月 / SYSTEM</span>
          </a>
          <span class="topbar-divider" aria-hidden="true">/</span>
          <span class="topbar-title">完整 Markdown 文件</span>
        </div>
        <div class="topbar-right">
          <span class="source-label">docs/system</span>
          <a class="home-link" href="../">首頁</a>
        </div>
      </header>

      <div class="reader-frame">
        <aside id="sidebar" class="sidebar" aria-label="系統文件目錄">
          <div class="sidebar-intro">
            <button id="sidebar-close" class="sidebar-close" type="button" aria-label="關閉文件目錄">×</button>
            <p class="eyebrow">DOCUMENTATION</p>
            <h1>Folks<br><em>Dating System</em></h1>
            <p>左側選擇章節，右側閱讀完整原始 Markdown。</p>
          </div>
          <nav id="doc-nav" class="doc-nav" aria-label="文件章節">
            <p class="nav-loading">載入文件目錄…</p>
          </nav>
          <div class="sidebar-meta">
            <span>24 DOCUMENTS</span>
            <span>READ-ONLY VIEW</span>
          </div>
        </aside>

        <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="關閉文件目錄"></button>

        <main id="main" class="reader-main">
          <div class="reader-toolbar">
            <div>
              <p class="eyebrow">READING / <span id="breadcrumb">00-index.md</span></p>
            </div>
            <div class="toolbar-meta" aria-label="文件位置">
              <span id="doc-position">01 / 18</span>
              <span>MARKDOWN</span>
            </div>
          </div>

          <div class="reader-body">
            <div id="loading" class="loading" role="status">正在載入完整文件…</div>
            <article id="document-content" class="markdown-body" hidden></article>
            <div id="load-error" class="load-error" role="alert" hidden>
              <h2>文件暫時無法載入</h2>
              <p id="load-error-message"></p>
              <button id="retry-load" class="retry-button" type="button">重新載入</button>
            </div>
          </div>

          <nav class="doc-pagination" aria-label="前後文件">
            <a id="previous-doc" class="pagination-link previous" href="#" hidden>
              <span class="pagination-label">← 上一份</span>
              <strong></strong>
            </a>
            <a id="next-doc" class="pagination-link next" href="#" hidden>
              <span class="pagination-label">下一份 →</span>
              <strong></strong>
            </a>
          </nav>

          <footer class="reader-footer">
            <span>Source: <code>docs/system</code></span>
            <a href="#main">回到文件頂端 ↑</a>
          </footer>
        </main>
      </div>
    </div>

    <noscript>
      <div class="no-script">這份閱讀器需要開啟 JavaScript，才能載入左側目錄與完整 Markdown 文件。</div>
    </noscript>
    <script type="module" src="./assets/reader.js?v=docs-24"></script>
  </body>
</html>
