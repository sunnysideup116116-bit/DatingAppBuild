name: DatingApp-Build-and-Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要打包的 DatingApp 分支名稱'
        required: true
        default: 'main'
        type: string
      release_notes:
        description: '更新日誌 / Release Notes (可選)'
        required: false
        default: ''
        type: string

concurrency:
  group: datingapp-release-${{ github.ref }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.44.3'
  TARGET_BRANCH: ${{ inputs.branch || 'main' }}

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      full_version: ${{ steps.metadata.outputs.full_version }}
      build_name: ${{ steps.metadata.outputs.build_name }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout DatingApp Private Source
        uses: actions/checkout@v4
        with:
          repository: 'edwinchu0711/DatingApp'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Read and validate pubspec version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          full_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          if [[ ! "$full_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([+][0-9]+)?$ ]]; then
            echo "::error::pubspec.yaml version must match MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH+BUILD: $full_version"
            exit 1
          fi

          build_name="$(printf '%s' "$full_version" | cut -d+ -f1)"
          build_number="$(printf '%s' "$full_version" | awk -F+ '{ print $2 + 0 }')"
          tag="v$full_version"

          {
            echo "full_version=$full_version"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Building DatingApp $full_version as GitHub Release $tag from branch $TARGET_BRANCH"

  android:
    name: Android APKs
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
    steps:
      - name: Checkout DatingApp Private Source
        uses: actions/checkout@v4
        with:
          repository: 'edwinchu0711/DatingApp'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Restore Firebase configuration
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "::error::Missing required secret ANDROID_GOOGLE_SERVICES_JSON_BASE64. Encode android/app/google-services.json with base64."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Restore fixed debug keystore when configured
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"

            keytool -list \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              >/dev/null
            echo "Using the configured shared debug keystore."
          else
            echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; Gradle will create a temporary runner debug keystore."
          fi

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build APKs with the shared local/CI command
        shell: bash
        run: bash scripts/build_android_apks.sh "$GITHUB_WORKSPACE/dist/android"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload obfuscation symbol maps
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols
          path: build/app/outputs/symbols
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS IPA
    needs: prepare
    runs-on: macos-15-intel
    env:
      FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
    steps:
      - name: Checkout DatingApp Private Source
        uses: actions/checkout@v4
        with:
          repository: 'edwinchu0711/DatingApp'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies when a Podfile exists
        if: ${{ hashFiles('ios/Podfile') != '' }}
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS without distribution signing
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ios/Payload
          cp -R build/ios/iphoneos/Runner.app dist/ios/Payload/Runner.app
          (
            cd dist/ios
            zip -qry "DatingApp-v$FULL_VERSION.ipa" Payload
          )
          rm -rf dist/ios/Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/ios/*.ipa
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS DMG
    needs: prepare
    runs-on: macos-15-intel
    env:
      FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
    steps:
      - name: Checkout DatingApp Private Source
        uses: actions/checkout@v4
        with:
          repository: 'edwinchu0711/DatingApp'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Prepare unsandboxed CI entitlements
        shell: bash
        run: |
          set -euo pipefail
          ci_entitlements="$RUNNER_TEMP/DatingApp.Release.entitlements"
          cp macos/Runner/Release.entitlements "$ci_entitlements"
          perl -0pi -e 's#(<key>com[.]apple[.]security[.]app-sandbox</key>[[:space:]]*)<true/>#$1<false/>#' "$ci_entitlements"
          grep -A1 -F '<key>com.apple.security.app-sandbox</key>' "$ci_entitlements" | grep -Fq '<false/>'
          cp "$ci_entitlements" macos/Runner/Release.entitlements

      - name: Build macOS application with CI mode
        run: flutter build macos --release --ci

      - name: Ad hoc sign and package DMG
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Flutter did not produce a macOS application bundle."
            exit 1
          fi

          ci_entitlements="$RUNNER_TEMP/DatingApp.Release.entitlements"
          codesign --force --deep --sign - --entitlements "$ci_entitlements" "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          entitlements_dump="$RUNNER_TEMP/DatingApp.entitlements.plist"
          codesign -d --entitlements :- "$app_path" > "$entitlements_dump" 2>&1 || true
          if ! grep -A1 -F '<key>com.apple.security.app-sandbox</key>' "$entitlements_dump" | grep -Fq '<false/>'; then
            echo "::error::The macOS release bundle is still sandboxed."
            exit 1
          fi

          lipo -info "$app_path/Contents/MacOS/dating_app"
          mkdir -p dist/macos
          hdiutil create \
            -format UDZO \
            -volname "DatingApp $FULL_VERSION" \
            -srcfolder "$app_path" \
            "dist/macos/DatingApp-v$FULL_VERSION-macOS.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest
    env:
      FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
    steps:
      - name: Checkout DatingApp Private Source
        uses: actions/checkout@v4
        with:
          repository: 'edwinchu0711/DatingApp'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Checkout DatingAppBuild for latest installer scripts
        uses: actions/checkout@v4
        with:
          path: build_repo

      - name: Apply installer_windows from DatingAppBuild
        shell: pwsh
        run: |
          if (Test-Path "build_repo/installer_windows") {
            New-Item -ItemType Directory -Force -Path "installer_windows" | Out-Null
            Copy-Item -Path "build_repo/installer_windows/*" -Destination "installer_windows" -Recurse -Force
            Write-Host "installer_windows applied from DatingAppBuild."
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          $iss = Join-Path $env:GITHUB_WORKSPACE "installer_windows/DatingApp_installer.iss"
          & $iscc "/DMyAppVersion=$env:FULL_VERSION" $iss

          $installer = Join-Path $env:GITHUB_WORKSPACE "build/windows/installer/DatingApp-Windows-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Inno Setup did not produce $installer"
          }

          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/windows"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $staging "DatingApp-v$env:FULL_VERSION-Windows-Setup.exe")

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/*.exe
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux Debian package
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
    steps:
      - name: Checkout DatingApp Private Source
        uses: actions/checkout@v4
        with:
          repository: 'edwinchu0711/DatingApp'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            dpkg-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Enable Linux desktop and install dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build and package Linux .deb
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux --release
          bash scripts/package_linux_deb.sh "$FULL_VERSION" "$GITHUB_WORKSPACE/dist/linux"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/*.deb
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - android
      - ios
      - macos
      - windows
      - linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dist/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist/ios

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist/linux

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected_files=(
            "dist/android/DatingApp-v$FULL_VERSION-v7a.apk"
            "dist/android/DatingApp-v$FULL_VERSION-v8a.apk"
            "dist/android/DatingApp-v$FULL_VERSION-x64.apk"
            "dist/ios/DatingApp-v$FULL_VERSION.ipa"
            "dist/macos/DatingApp-v$FULL_VERSION-macOS.dmg"
            "dist/windows/DatingApp-v$FULL_VERSION-Windows-Setup.exe"
            "dist/linux/DatingApp-v$FULL_VERSION-Linux-amd64.deb"
          )

          for artifact in "${expected_files[@]}"; do
            test -s "$artifact" || {
              echo "::error::Missing release artifact: $artifact"
              exit 1
            }
          done
          find dist -maxdepth 2 -type f -print | sort

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          release_notes_file="$RUNNER_TEMP/datingapp-release-notes.md"
          build_time="$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S') (UTC+8)"

          {
            printf '#### 版本資訊\n'
            printf -- '- 建立時間: %s\n' "$build_time"
            printf -- '- 專案版本: %s\n' "$TAG"
            printf -- '- 來源分支: `%s`\n\n' "$TARGET_BRANCH"
            printf '#### 各平台安裝檔案說明\n'
            printf '| 檔案名稱 | 適用作業系統 | 說明 |\n'
            printf '| --- | --- | --- |\n'
            printf '| `DatingApp-v%s-v8a.apk` | Android (arm64-v8a) | 適用於多數現代 Android 手機與平板 |\n' "$FULL_VERSION"
            printf '| `DatingApp-v%s-v7a.apk` | Android (armeabi-v7a) | 適用於較舊款 32 位元 Android 裝置 |\n' "$FULL_VERSION"
            printf '| `DatingApp-v%s-x64.apk` | Android (x86_64) | 適用於 Android 模擬器或 x86_64 架構裝置 |\n' "$FULL_VERSION"
            printf '| `DatingApp-v%s.ipa` | iOS | 適用於 iOS 裝置 |\n' "$FULL_VERSION"
            printf '| `DatingApp-v%s-macOS.dmg` | macOS | 適用於 macOS 系統安裝 |\n' "$FULL_VERSION"
            printf '| `DatingApp-v%s-Windows-Setup.exe` | Windows | 適用於 Windows 10 / 11 (x64) 安裝 |\n' "$FULL_VERSION"
            printf '| `DatingApp-v%s-Linux-amd64.deb` | Linux | 適用於 Debian / Ubuntu 系列 (amd64) 安裝 |\n' "$FULL_VERSION"
          } > "$release_notes_file"

          if [[ -n "${RELEASE_NOTES_INPUT:-}" ]]; then
            printf '\n#### 更新說明\n%s\n' "$RELEASE_NOTES_INPUT" >> "$release_notes_file"
          fi

          echo "RELEASE_NOTES_FILE=$release_notes_file" >> "$GITHUB_ENV"

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "DatingApp $TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$TAG" \
              --title "DatingApp $TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find dist -maxdepth 2 -type f -print | sort)
          gh release upload "$TAG" "${artifacts[@]}" --clobber
